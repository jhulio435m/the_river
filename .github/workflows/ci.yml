name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libglfw3-dev \
            libssl-dev \
            pkg-config

      - name: Configure
        run: cmake -S the_river_cpp -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
